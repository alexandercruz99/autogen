[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-bot"
version = "0.1.0"
description = "Analyze today's MLB slate: win picks, HR candidates, and best bets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
baseball-bot = "baseball_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
